services:
  api:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/quickbite
      DB_USERNAME: ${DB_USERNAME:-quickbite}
      DB_PASSWORD: ${DB_PASSWORD:-quickbite}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER: ${JWT_ISSUER:-quickbite-local}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT2H}
      ORDER_QUEUE_KEY: ${ORDER_QUEUE_KEY:-quickbite:orders:created}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@quickbite.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-quickbite-admin-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: quickbite
      POSTGRES_USER: ${DB_USERNAME:-quickbite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quickbite}
    volumes:
      - quickbite-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-quickbite} -d quickbite"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - quickbite-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  quickbite-postgres:
  quickbite-redis:
